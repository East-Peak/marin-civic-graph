sources:
  - id: fairfax-town-council
    adapter: proudcity
    url: https://townoffairfaxca.gov/meetings/
    jurisdiction_id: place-fairfax
    institution_id: org-fairfax-town-council
    backfill_from: "2019-01-01"
    schedule: weekly
    agenda_items:
      artifact: agenda
      parser: flat
      hosts: [storage.googleapis.com]
      body: {title: "Town Council", document: "Town Council"}
      qualified: {parser: flat, version: 1, report: "~/open-marin-staging/weekly-agenda-items/REPORT.md#per-source"}
    archive_pages:
      # 2025 onward: the per-year archive pages stopped at 2024 (the 2025 one
      # 404s) and /meetings/ now lists only undated upcoming events. This page
      # carries dated 2025-26 meetings (audit 2026-09-28: 44 meetings).
      - https://townoffairfaxca.gov/agendas-town-council/
      - https://townoffairfaxca.gov/2024-meeting-archive/
      - https://townoffairfaxca.gov/2023-meeting-archive/
      - https://townoffairfaxca.gov/2022-meeting-archive/
      - https://townoffairfaxca.gov/2021-meeting-archive/
      - https://townoffairfaxca.gov/2020-meeting-archive/
      - https://townoffairfaxca.gov/2019-meeting-archive/

  - id: belvedere-city-council
