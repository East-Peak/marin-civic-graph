    institution_id: org-belvedere-city-council
    backfill_from: "2019-01-01"
    schedule: weekly
    agenda_items:
      artifact: packet  # the adapter files the agenda PDF (whole packet before 2023) as the packet
      parser: outline
      hosts: [storage.googleapis.com]
      body: {title: "City Council", document: "City Council"}
      qualified: {parser: outline, version: 8, report: "~/open-marin-staging/weekly-agenda-items/REPORT.md#per-source"}
    archive_pages:
      - https://www.cityofbelvedere.org/city-council-meeting-archive/

  # San Rafael, the case-study city. Its Meetings were built by the wave-01 one-off
  # scripts (meeting-{date}-san-rafael-city-council[-suffix]), not by this adapter
  # (meeting-{source_id}-{slug}): identity comes only from the reviewed crosswalk
  # (exact meeting-page slug -> existing id) or the adapter's own id, and the load
  # never overwrites an existing node (scripts/crosswalk.py; runbook
  # docs/runbooks/san-rafael-weekly.md).
  - id: san-rafael-city-council
    adapter: proudcity
    url: https://www.cityofsanrafael.org/city-council-meetings/
    jurisdiction_id: place-san-rafael
    institution_id: org-san-rafael-city-council
    agenda_items:
      artifact: agenda
      parser: lettered
      hosts: [storage.googleapis.com]
      body: {title: "City Council", document: "City Council"}
      session: {from: [title, id], match: exact}  # the wave-01 titles are all "San Rafael City Council meeting"
      qualified: {parser: lettered, version: 4, report: "~/open-marin-staging/agenda-parsers-sr-larkspur/REPORT.md#per-source"}
    backfill_from: "2019-01-01"
    identity: crosswalk-required
    crosswalk: registry/crosswalks/san-rafael-city-council.json
    schedule: manual
    schedule_note: >-
      Held off the weekly schedule until the no-overwrite load and its rehearsal
      land and the switch is reviewed (docs/runbooks/san-rafael-weekly.md).
