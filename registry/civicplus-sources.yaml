sources:
  # Corte Madera — split by body so institution_id is accurate
  - id: corte-madera-town-council
    adapter: civicplus
    url: https://cortemadera.gov/AgendaCenter
    jurisdiction_id: place-corte-madera
    institution_id: org-corte-madera-town-council
    backfill_from: "2019-01-01"
    schedule: weekly
    categories: ["Town Council"]
    floors:
      note: >-
        The ledger seed came from the April capture, which held every CivicPlus
        category (903 rows); this source is Town Council only (~252), so its row
        floor rejects it until the operator checks one pull by hand and runs
        `python scripts/ingest_baseline.py --reset corte-madera-town-council
        --reason "..."`. Seeding now skips such wider-scoped captures.

  - id: corte-madera-planning-commission
    adapter: civicplus
    url: https://cortemadera.gov/AgendaCenter
    jurisdiction_id: place-corte-madera
    institution_id: org-corte-madera-planning-commission
    backfill_from: "2019-01-01"
    schedule: manual
    schedule_note: >-
      Held off the weekly schedule until reconciled with the April capture, which
      ran as one combined source (corte-madera-town-council /
      org-corte-madera-town-council) covering every category: 182 of this
      source's 193 meetings are already there under corte-madera-town-council
      ids, so scheduling it now would ingest them a second time under a
      different institution.
    categories: ["Planning Commission"]

  # Tiburon — only has 2012-2016 data on CivicPlus (recent meetings elsewhere)
  - id: tiburon-town-council
    adapter: civicplus
    url: https://townoftiburon.org/AgendaCenter
    jurisdiction_id: place-tiburon
    institution_id: org-tiburon-town-council
    backfill_from: "2012-01-01"
    schedule: retired
    schedule_note: >-
      CivicPlus offers only 2013-2016 and returned 0 meetings (audit 2026-09-28).
      Current Tiburon meetings come from the Granicus source.
    categories: ["Town Council"]

  # Mill Valley — City Council not on CivicPlus; capture Planning Commission
  - id: mill-valley-planning-commission
    adapter: civicplus
    url: https://www.cityofmillvalley.gov/AgendaCenter
    jurisdiction_id: place-mill-valley
    institution_id: org-mill-valley-planning-commission
    backfill_from: "2019-01-01"
    schedule: manual
    schedule_note: >-
      Held off the weekly schedule until reconciled with the April capture, which
      ran as one combined source (mill-valley-committees / org-mill-valley-committees)
      covering these same bodies; scheduling per-body sources now would ingest the
      same meetings a second time under different institutions.
    categories: ["Planning Commission"]

  - id: mill-valley-parks-recreation
    adapter: civicplus
    url: https://www.cityofmillvalley.gov/AgendaCenter
    jurisdiction_id: place-mill-valley
    institution_id: org-mill-valley-parks-recreation-commission
    backfill_from: "2019-01-01"
    schedule: manual
    schedule_note: >-
      Held off the weekly schedule until reconciled with the April capture, which
      ran as one combined source (mill-valley-committees / org-mill-valley-committees)
      covering these same bodies; scheduling per-body sources now would ingest the
      same meetings a second time under different institutions.
    categories: ["Parks & Recreation Commission"]
