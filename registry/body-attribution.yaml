# Body attribution (scripts/body_attribution.py): the April combined CivicPlus captures filed every AgendaCenter
# category under one institution. For each such source institution: its own category (meetings that stay), and
# the body that holds each other category. `aliases` are the names a meeting title uses for a body (a title that
# names a body other than its category's is held for review); `source` cites the evidence for the body and its
# jurisdiction. IN_JURISDICTION from an Organization means the Place whose public the body governs or serves; for
# a multi-member body, the smallest Place in the graph containing all its members.
sources:
  org-corte-madera-town-council:
    own_category: Town Council
    own_aliases: [town council]
    other_aliases: {}
    bodies:
      - category: Planning Commission
        institution_id: org-corte-madera-planning-commission
        name: Corte Madera Planning Commission
        jurisdiction_id: place-corte-madera
        aliases: [planning commission]
        source: cortemadera.gov AgendaCenter category "Planning Commission" (a Town commission)
      - category: Sanitary District No. 2 Board
        institution_id: org-corte-madera-sanitary-district-no-2
        name: Sanitary District No. 2 of Marin County
        jurisdiction_id: place-corte-madera
        aliases: [sanitary district no 2, sd2, sd 2]
        source: >-
          Form 700 agency field, e.g. filing-form700-ctm-2023-01-27-thomas-rosa-assuming-office-director-sanitary-district-no-2-of-marin-county-a-subsidiary-district-to-the-town-of-corte-madera:
          "Sanitary District No. 2 of Marin County, a subsidiary district to the Town of Corte Madera" (its board
          is the Town Council)
      - category: Parks and Recreation Commission
        institution_id: org-corte-madera-parks-recreation-commission
        name: Corte Madera Parks and Recreation Commission
        jurisdiction_id: place-corte-madera
        aliases: [parks and recreation commission, parks and recreation special commission, parks and recreation regular commission]
        source: cortemadera.gov AgendaCenter category "Parks and Recreation Commission"
      - category: Climate Action Committee
        institution_id: org-corte-madera-climate-action-committee
        name: Corte Madera Climate Action Committee
        jurisdiction_id: place-corte-madera
        aliases: [climate action committee]
        source: cortemadera.gov AgendaCenter category "Climate Action Committee"
      - category: Bicycle Pedestrian Advisory Committee
        institution_id: org-corte-madera-bicycle-pedestrian-advisory-committee
        name: Corte Madera Bicycle Pedestrian Advisory Committee
        jurisdiction_id: place-corte-madera
        aliases: [bicycle pedestrian advisory committee, bpac]
        source: cortemadera.gov AgendaCenter category "Bicycle Pedestrian Advisory Committee"
      - category: Flood Control Board
        institution_id: org-corte-madera-flood-control-board
        name: Corte Madera Flood Control Board
        jurisdiction_id: place-corte-madera
        aliases: [flood control board]
        source: cortemadera.gov AgendaCenter category "Flood Control Board" (titles "Corte Madera Flood Control Board")
      - category: Fire Council - Central Marin Fire Authority
        institution_id: org-central-marin-fire-authority
        name: Central Marin Fire Authority
        jurisdiction_id: place-marin-county
        aliases: [central marin fire authority, central marin fire council, fire council]
        source: >-
          CMFA Fire Council agenda 2021-05-13 (meeting-corte-madera-town-council-1004): a joint powers authority of
          two "member agencies, the City of Larkspur and the Town of Corte Madera. Each member agency pays 50%"
      - category: Sales Tax Citizens' Oversight Committee
        institution_id: org-corte-madera-sales-tax-citizens-oversight-committee
        name: Corte Madera Sales Tax Citizens' Oversight Committee
        jurisdiction_id: place-corte-madera
        aliases: [sales tax citizens oversight committee, sales tax citizens' oversight committee]
        source: cortemadera.gov AgendaCenter category "Sales Tax Citizens' Oversight Committee"
      - category: Finance Advisory Committee
        institution_id: org-corte-madera-finance-advisory-committee
        name: Corte Madera Finance Advisory Committee
        jurisdiction_id: place-corte-madera
        aliases: [finance advisory committee]
        source: cortemadera.gov AgendaCenter category "Finance Advisory Committee"

