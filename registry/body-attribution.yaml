      - category: Transportation & Mobility Advisory Committee
        institution_id: org-mill-valley-transportation-mobility-advisory-committee
        name: Mill Valley Transportation & Mobility Advisory Committee
        jurisdiction_id: place-mill-valley
        aliases: [transportation and mobility advisory committee, traffic and mobility advisory committee, tmac]
