sources:
  - id: ross-town-council
    adapter: drupal_ross
    url: https://townofrossca.gov/meetings
    jurisdiction_id: place-ross
    institution_id: org-ross-town-council
    backfill_from: "2019-01-01"
    # Weekly, not monthly: the site shows only a rolling ~6-month window with no
    # history, so a missed pass can lose meetings permanently.
    schedule: weekly
    floors:
      min_ratio: 0.5  # rolling window: the listed count legitimately swings
